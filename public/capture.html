<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현재 화면 캡처</title>
<!--
  증빙 화면(네이버 지도·하이패스·오피넷 등)은 다른 회사 사이트라
  그 화면 안에 버튼을 넣을 수가 없습니다. 그래서 캡처 버튼만 담은
  이 작은 창을 옆에 같이 띄웁니다. 여기서 캡처하면 원래 정산 화면의
  3단계로 사진이 바로 들어갑니다.
-->
<style>
:root{--g:#137a54;--g-d:#0e6144;--ink:#17201d;--ink-2:#4a5854;--mu:#7c8b86;--ln:#dfe6e3}
*{box-sizing:border-box}
body{margin:0;padding:16px;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
  color:var(--ink);background:#f7f9f8}
h1{font-size:14px;margin:0 0 4px}
p{margin:0 0 12px;font-size:12px;color:var(--ink-2)}
.tgt{font-weight:600;color:var(--g-d)}
button{width:100%;padding:13px 16px;font-size:15px;font-weight:600;color:#fff;background:var(--g);
  border:none;border-radius:9px;cursor:pointer}
button:hover{background:var(--g-d)}
button:disabled{background:var(--mu);cursor:default}
#msg{margin:11px 0 0;font-size:12px;color:var(--ink-2);min-height:32px}
#msg.warn{color:#c0392b}
#msg.ok{color:var(--g-d);font-weight:600}
</style>
</head>
<body>
<h1>증빙 화면을 캡처하세요</h1>
<p><span class="tgt" id="tgt">증빙 화면</span>을 확인한 뒤 아래 버튼을 누르고,
목록에서 <b>그 창</b>을 고르면 정산 화면으로 사진이 바로 들어갑니다.</p>
<button id="cap">현재 화면 캡처</button>
<p id="msg"></p>

<script>
var $=function(i){return document.getElementById(i);};
function msg(t,cls){ var m=$("msg"); m.textContent=t; m.className=cls||""; }

var 이름=new URLSearchParams(location.search).get("t");
if(이름)$("tgt").textContent=이름;

if(!window.opener||window.opener.closed){
  msg("정산 화면을 찾지 못했습니다. 이 창을 닫고 정산 화면의 '화면 캡처' 를 눌러 주세요.","warn");
  $("cap").disabled=true;
}

$("cap").addEventListener("click",function(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)){
    msg("이 브라우저에서는 화면 캡처를 쓸 수 없습니다. 정산 화면의 '파일에서 고르기' 를 쓰세요.","warn");
    return;
  }
  $("cap").disabled=true;
  msg("어느 창을 가져올지 고르는 창이 떴습니다. 방금 본 화면을 고르고 공유를 누르세요.");

  navigator.mediaDevices.getDisplayMedia({video:{displaySurface:"window"},audio:false})
    .then(function(stream){
      var v=document.createElement("video");
      v.srcObject=stream; v.muted=true; v.playsInline=true;
      return v.play()
        .then(function(){ return new Promise(function(r){ setTimeout(function(){r(v);},350); }); })
        .then(function(vv){
          var c=document.createElement("canvas");
          c.width=vv.videoWidth; c.height=vv.videoHeight;
          if(!c.width||!c.height)throw new Error("빈 화면을 받았습니다");
          c.getContext("2d").drawImage(vv,0,0,c.width,c.height);
          stream.getTracks().forEach(function(t){t.stop();});
          return c.toDataURL("image/png");
        },function(e){
          stream.getTracks().forEach(function(t){t.stop();});
          throw e;
        });
    })
    .then(function(url){
      window.opener.postMessage({t:"jacha-cap", url:url}, location.origin);
      msg("가져왔습니다 — 정산 화면 3단계에 들어갔습니다. 이 창은 곧 닫힙니다.","ok");
      setTimeout(function(){
        try{ window.opener.focus(); }catch(e){}
        window.close();
      },1200);
    })
    ["catch"](function(e){
      var n=(e&&e.name)||"";
      msg(n==="NotAllowedError"
        ? "캡처를 취소했거나 권한이 거부되었습니다. 다시 눌러 보세요."
        : "캡처하지 못했습니다 — "+((e&&e.message)||n), "warn");
      $("cap").disabled=false;
    });
});
</script>
</body>
</html>
