<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현재 화면 캡처</title>
<!--
  증빙 화면(네이버 지도·하이패스·오피넷 등)은 다른 회사 사이트라
  그 화면 안에 버튼을 넣을 수가 없습니다. 그래서 캡처 버튼만 담은
  이 창을 옆에 같이 띄웁니다. 여기서 캡처하면 원래 정산 화면의
  3단계로 사진이 바로 들어갑니다.

  브라우저 보안 규칙상 '무엇을 캡처할지' 묻는 창은 건너뛸 수 없습니다.
  대신 열려 있는 창 목록을 기본으로 보여 주어 증빙 화면만 골라 찍게 하고,
  한 번 고르면 그 뒤로는 묻지 않고 같은 창을 바로 찍게 했습니다.
-->
<style>
:root{--g:#137a54;--g-d:#0e6144;--ink:#17201d;--ink-2:#4a5854;--mu:#7c8b86;--ln:#dfe6e3}
*{box-sizing:border-box}
body{margin:0;padding:18px;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
  color:var(--ink);background:#f7f9f8}
h1{font-size:15px;margin:0 0 5px}
p{margin:0 0 13px;font-size:12.5px;color:var(--ink-2)}
.tgt{font-weight:600;color:var(--g-d)}
button{width:100%;padding:14px 16px;font-size:15px;font-weight:600;color:#fff;background:var(--g);
  border:none;border-radius:9px;cursor:pointer}
button:hover{background:var(--g-d)}
button:disabled{background:var(--mu);cursor:default}
button.sub{margin-top:9px;padding:10px 14px;font-size:13px;font-weight:500;
  color:var(--ink-2);background:#fff;border:1px solid var(--ln)}
button.sub:hover{background:#eef3f1}
button.sub.done{margin-top:7px;color:#fff;background:var(--ink);border-color:var(--ink)}
button.sub.done:hover{background:#000}
#msg{margin:13px 0 0;font-size:12.5px;color:var(--ink-2);min-height:36px}
#msg.warn{color:#c0392b}
#msg.ok{color:var(--g-d);font-weight:600}
.hint{margin:14px 0 0;font-size:11.5px;color:var(--mu);line-height:1.5}
</style>
</head>
<body>
<h1>증빙 화면을 캡처하세요</h1>
<p>아래 버튼을 누르면 열려 있는 창 목록이 뜹니다.
<span class="tgt" id="tgt">증빙 화면</span>을 골라 주시면 정산 화면 3단계로 바로 들어갑니다.</p>

<button id="cap">현재 화면 캡처</button>
<button class="sub" id="again" hidden>같은 창 한 번 더 캡처 (묻지 않고 바로)</button>
<button class="sub done" id="fin" hidden>캡처 끝 — 증빙 창과 이 창 닫기</button>
<p id="msg"></p>
<p class="hint">처음 한 번은 브라우저가 "공유할 항목"을 묻습니다 — <b>창</b> 탭에서 증빙 화면을 고르고
<b>공유</b>를 누르세요. 그 뒤로는 묻지 않고 같은 창이 바로 찍힙니다.
필요 없는 부분은 정산 화면 3단계에서 드래그로 잘라내면 됩니다.</p>

<script>
var $=function(i){return document.getElementById(i);};
function msg(t,cls){ var m=$("msg"); m.textContent=t; m.className=cls||""; }

var 이름=new URLSearchParams(location.search).get("t");
if(이름)$("tgt").textContent=이름;

if(!window.opener||window.opener.closed){
  msg("정산 화면을 찾지 못했습니다. 이 창을 닫고 정산 화면의 '화면 캡처' 를 눌러 주세요.","warn");
  $("cap").disabled=true;
}

// 한 번 허용받은 화면은 계속 들고 있다가 다시 찍을 때 그대로 씁니다.
// (브라우저가 '공유할 항목' 을 다시 묻지 않습니다)
var STREAM=null, VIDEO=null;

function 살아있나(){
  var t=STREAM&&STREAM.getVideoTracks()[0];
  return !!(t&&t.readyState==="live");
}

function 화면놓기(){
  try{ if(STREAM)STREAM.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  STREAM=null; VIDEO=null; $("again").hidden=true;
}

function 화면잡기(새로){
  if(새로)화면놓기();                 // '다른 창 고르기' 는 목록을 다시 띄웁니다
  if(살아있나())return Promise.resolve();
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia))
    return Promise.reject(new Error("이 브라우저에서는 화면 캡처를 쓸 수 없습니다"));

  msg("브라우저가 '공유할 항목' 을 묻습니다. '창' 탭에서 증빙 화면을 고르고 '공유' 를 누르세요.");
  return navigator.mediaDevices.getDisplayMedia({
    // 열려 있는 창 목록을 기본으로 보여 줍니다 — 증빙 화면만 깔끔하게 찍힙니다
    video:{ displaySurface:"window" },
    audio:false,
    selfBrowserSurface:"exclude",     // 이 캡처 창 자신은 목록에서 뺍니다
    surfaceSwitching:"exclude"
  }).then(function(s){
    STREAM=s;
    VIDEO=document.createElement("video");
    VIDEO.srcObject=s; VIDEO.muted=true; VIDEO.playsInline=true;
    s.getVideoTracks()[0].addEventListener("ended",function(){ STREAM=null; VIDEO=null; $("again").hidden=true; });
    return VIDEO.play().then(function(){
      return new Promise(function(r){ setTimeout(r,300); });   // 첫 프레임을 기다립니다
    });
  });
}

function 한장찍기(){
  var c=document.createElement("canvas");
  c.width=VIDEO.videoWidth; c.height=VIDEO.videoHeight;
  if(!c.width||!c.height)throw new Error("빈 화면을 받았습니다");
  c.getContext("2d").drawImage(VIDEO,0,0,c.width,c.height);
  var url=c.toDataURL("image/png");
  window.opener.postMessage({t:"jacha-cap", url:url}, location.origin);
  return url;
}

function 캡처(새로){
  $("cap").disabled=true; $("again").disabled=true;
  화면잡기(새로)
    .then(function(){ 한장찍기(); })
    .then(function(){
      msg("가져왔습니다 — 정산 화면 3단계에 들어갔습니다. "
        + "다 끝났으면 아래 '캡처 끝' 을 눌러 창을 함께 닫으세요.","ok");
      $("again").hidden=false;
      $("fin").hidden=false;
      $("cap").textContent="다른 창 고르기";
      try{ window.opener.focus(); }catch(e){}
    })
    ["catch"](function(e){
      var n=(e&&e.name)||"";
      msg(n==="NotAllowedError"
        ? "캡처를 취소했거나 권한이 거부되었습니다. 다시 눌러 보세요."
        : "캡처하지 못했습니다 — "+((e&&e.message)||n), "warn");
    })
    ["finally"](function(){ $("cap").disabled=false; $("again").disabled=false; });
}

// 위 버튼은 언제나 창 목록을 다시 띄우고, 아래 버튼은 고른 창을 그대로 다시 찍습니다
$("cap").addEventListener("click",function(){ 캡처(true); });
$("again").addEventListener("click",function(){ 캡처(false); });

// 캡처가 끝나면 증빙 창과 이 창을 손으로 하나씩 닫아야 했습니다.
// 두 창 모두 정산 화면이 연 창이라 정산 화면에 닫아 달라고 부탁합니다.
// (그래도 안 닫히는 경우를 대비해 이 창은 스스로도 닫습니다)
$("fin").addEventListener("click",function(){
  화면놓기();
  msg("창을 닫는 중입니다…","ok");
  try{ window.opener.postMessage({t:"jacha-cap-close"}, location.origin); }catch(e){}
  setTimeout(function(){
    try{ window.opener.focus(); }catch(e){}
    window.close();
  },350);
});

window.addEventListener("pagehide",function(){
  try{ if(STREAM)STREAM.getTracks().forEach(function(t){t.stop();}); }catch(e){}
});
</script>
</body>
</html>
